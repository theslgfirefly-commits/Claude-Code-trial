<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WSJ Tech News Briefing プレイヤー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>WSJ Tech News Briefing プレイヤー</h1>
    <p class="subtitle">取得済みエピソードをリピート再生できます。</p>

    <section class="panel">
      <label for="episode-select">エピソードを選択</label>
      <select id="episode-select">
        <option value="">読み込み中...</option>
      </select>

      <div id="now-playing" class="now-playing" hidden>
        <h2 id="episode-title"></h2>
        <p id="episode-date"></p>
        <a id="episode-link" href="#" target="_blank" rel="noopener">エピソードページを開く</a>
      </div>

      <audio id="player" controls loop></audio>

      <label class="loop-toggle">
        <input type="checkbox" id="loop-toggle" checked>
        リピート再生 (loop)
      </label>
    </section>

    <details class="manual-panel">
      <summary>音声URLを直接指定して再生</summary>
      <div class="manual-form">
        <input type="url" id="manual-url" placeholder="https://example.com/episode.mp3">
        <button id="manual-load">読み込んで再生</button>
      </div>
    </details>

    <p id="status" class="status"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
